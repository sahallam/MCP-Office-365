name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for reporting a bug!

        **Note:** Issues are reviewed monthly (1st of each month). For faster resolution, consider forking and fixing it yourself!

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm you've done these before submitting
      options:
        - label: I've checked the [troubleshooting guide](https://github.com/sahallam/MCP-Office-365/blob/main/README.md#troubleshooting)
          required: true
        - label: I've searched [existing issues](https://github.com/sahallam/MCP-Office-365/issues)
          required: true
        - label: I'm using the [latest release](https://github.com/sahallam/MCP-Office-365/releases)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue
      placeholder: |
        1. Configure .env with...
        2. Run command...
        3. Click on...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, this happened...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Information about your environment
      value: |
        - OS: [e.g., macOS 14.2, Windows 11, Ubuntu 22.04]
        - Node.js version: [run `node --version`]
        - Package version: [e.g., 1.0.0]
        - Authentication mode: [delegated or app-only]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Messages / Logs
      description: Paste any error messages or relevant logs
      placeholder: |
        [AUTH] Error: ...
        Error stack trace...
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (screenshots, etc.)
