name: Documentation Issue
description: Report incorrect or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ## Documentation Improvement

        Thanks for helping improve our documentation!

  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation Type
      description: Which documentation needs improvement?
      options:
        - README.md
        - CONTRIBUTING.md
        - RELEASE_NOTES.md
        - GITHUB_RULESETS.md
        - Code comments
        - Other
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Where is the documentation issue? (file name, section, line number)
      placeholder: "README.md, line 123 in the 'Setup' section"
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What kind of issue is this?
      options:
        - Incorrect information
        - Unclear/confusing
        - Missing information
        - Typo/grammar
        - Broken link
        - Outdated
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Documentation
      description: What does it currently say? (paste or quote)
      placeholder: |
        Current text:
        "To install, run npm start"
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested Improvement
      description: What should it say instead? (if you have a suggestion)
      placeholder: |
        Suggested text:
        "To install dependencies, run npm install. Then start the server with npm start."

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Why is this important? Who does it help?
